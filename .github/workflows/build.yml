name: Build and Deploy Vite App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    env:
      GITHUB_TOKEN: ${{ secrets.UI_READ_TOKEN || github.token }}
    defaults:
      run:
        working-directory: planner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: planner

      - name: Checkout shared UI
        uses: actions/checkout@v4
        with:
          repository: jordiorriols/ui
          ref: ${{ vars.UI_REF || 'main' }}
          path: ui
          token: ${{ secrets.UI_READ_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            planner/package-lock.json
            ui/package-lock.json

      - name: Build shared UI
        working-directory: ui
        run: npm ci --ignore-scripts && npm run build

      - name: Install dependencies
        run: npm ci --install-links

      - name: Compile Typescript project
        run: npm run compile

      - name: Lint Project
        run: npm run lint

      - name: Check Prettier
        run: npm run format:check

      - name: Test Project with Coverage
        run: npm run test:coverage

      - name: Build Vite project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: planner/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
