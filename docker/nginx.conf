server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Host $host;
    }
    location = /planner { return 302 /planner/; }
    location /planner/assets/ { try_files $uri =404; }
    location /planner/ {
        try_files $uri $uri/ /planner/index.html;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
